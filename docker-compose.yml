services:
  backend:
    build:
      context: ./backend
    image: sucar-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Point the SPA at the backend. Override for your deployment domain.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: sucar-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # One-shot migration runner. Run on demand (or as a deploy step):
  #   docker compose --profile migrate run --rm migrate
  # Requires DATABASE_URL (direct Postgres connection string) in backend/.env.
  migrate:
    build:
      context: ./backend
    image: sucar-backend
    env_file:
      - ./backend/.env
    command: ["npm", "run", "migrate:all"]
    profiles:
      - migrate
